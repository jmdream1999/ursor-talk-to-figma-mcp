<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cursor Talk to Figma - Login</title>
    <link rel="stylesheet" href="login.css">
</head>
<body>
    <!-- Status Bar -->
    <div class="status-bar">
        <div class="time">9:41</div>
        <div class="icons">
            <img src="assets/Cellular Connection.svg" alt="Cellular">
            <img src="assets/Wifi.svg" alt="Wifi">
            <img src="assets/Cap.svg" alt="Battery">
        </div>
    </div>

    <!-- Login Buttons -->
    <div class="login-container">
        <button class="kakao-login">
            <img src="assets/kakao.png" alt="Kakao" class="kakao-icon">
            카카오톡으로 시작하기
        </button>
        <button class="google-login">
            <img src="assets/google.png" alt="Google" class="google-icon">
            구글로 시작하기
        </button>
    </div>

    <!-- Bottom Text -->
    <div class="bottom-text">
        <p>계속 진행하면 Cursor Talk의 서비스 약관 및 개인정보 보호정책에 동의하는 것으로 간주됩니다.</p>
    </div>

    <!-- Home Indicator -->
    <div class="home-indicator">
        <div class="indicator"></div>
    </div>
</body>
</html>
