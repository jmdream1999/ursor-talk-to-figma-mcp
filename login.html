<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cursor Talk to Figma - Login</title>
    <link rel="stylesheet" href="login.css">
</head>
<body>
    <!-- Status Bar -->
    <div class="status-bar">
        <div class="time">9:41</div>
        <div class="icons">
            <img src="assets/cellular.svg" alt="Cellular" class="cellular">
            <img src="assets/wifi.svg" alt="Wifi" class="wifi">
            <div class="battery-container">
                <div class="battery">
                    <div class="battery-level"></div>
                </div>
                <div class="battery-tip"></div>
            </div>
        </div>
    </div>

    <!-- Login Buttons -->
    <div class="login-container">
        <button class="kakao-login">
            <img src="assets/kakao.svg" alt="Kakao" class="kakao-icon">
            Continue with Kakao
        </button>
        <button class="google-login">
            <img src="assets/google.svg" alt="Google" class="google-icon">
            Continue with Google
        </button>
        <button class="contact-us">
            Contact Us
        </button>
    </div>

    <!-- Home Indicator -->
    <div class="home-indicator">
        <div class="indicator"></div>
    </div>
</body>
</html>
